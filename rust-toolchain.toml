# Pinned exactly, not tracked.
#
# `stable` was the worst of both: strong enough to outrank the toolchain CI
# installs -- which is why the msrv job has to set RUSTUP_TOOLCHAIN by hand --
# and loose enough that a Rust release could break the build with no commit
# touching the repository. It did, twice, both times through a new clippy lint
# that only CI was new enough to see.
#
# Pinned, everyone compiles with the same compiler and upgrading Rust is a
# deliberate one-line change that can be tested like any other.
# The wasm target lives here too, for the same reason the version does. A
# toolchain named `stable` and one named `1.98.1` are different installations to
# rustup even when they are the same compiler, so a target added to one is
# missing from the other -- which is how pinning the version broke the job that
# builds the layout engine for wasm32, without touching a line of its code.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
