[workspace]
resolver = "3"
members = [
    "crates/irontile-layout",
    "crates/irontile-comp",
    "crates/irontile-ipc",
    "crates/irontile-ui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andrew/irontile"

[workspace.dependencies]
irontile-layout = { path = "crates/irontile-layout", version = "0.1.0" }
irontile-ipc = { path = "crates/irontile-ipc", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
anyhow = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
