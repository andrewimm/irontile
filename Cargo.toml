[workspace]
resolver = "3"
members = [
    "crates/irontile-layout",
    "crates/irontile-power",
    "crates/irontile-comp",
    "crates/irontile-ipc",
    "crates/irontile-ui",
    "crates/irontile-session",
    "crates/irontile-lock",
    "xtask",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/andrewimm/irontile"

[workspace.dependencies]
irontile-layout = { path = "crates/irontile-layout", version = "0.2.0" }
irontile-ipc = { path = "crates/irontile-ipc", version = "0.2.0" }
irontile-power = { path = "crates/irontile-power", version = "0.2.0" }
libpulse-binding = "2.30"
zbus = "5"
serde = { version = "1", features = ["derive"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
anyhow = "1"
toml = "0.9"
libc = "0.2"
signal-hook = "0.3"
pam = "0.8"
xkbcommon = "0.9"
xcursor = "0.3"
tiny-skia = "0.12"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
cosmic-text = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
proptest = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["shm", "mm", "event", "time", "pipe"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
