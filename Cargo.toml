[workspace]
resolver = "3"
members = [
    "crates/irontile-layout",
    "crates/irontile-comp",
    "crates/irontile-ipc",
    "crates/irontile-ui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andrew/irontile"

[workspace.dependencies]
irontile-layout = { path = "crates/irontile-layout", version = "0.1.0" }
irontile-ipc = { path = "crates/irontile-ipc", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
