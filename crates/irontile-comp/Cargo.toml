[package]
name = "irontile-comp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "irontile Wayland compositor"

[[bin]]
name = "irontile"
path = "src/main.rs"

[dependencies]
irontile-layout.workspace = true
rustix.workspace = true
irontile-version.workspace = true
irontile-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
smithay.workspace = true
smithay-drm-extras.workspace = true
libc.workspace = true
zbus.workspace = true
xcursor.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
irontile-ipc.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
rustix.workspace = true

[lints]
workspace = true

# Packaging. Both of these describe the same package -- every irontile binary,
# plus the session entry that makes it selectable at login -- and both are built
# by running the tool inside a container of the distribution being packaged for,
# never on the developer's machine. Three things go wrong otherwise:
#
#   - glibc is not backward compatible. A binary built against a newer one than
#     the target has simply will not start there.
#   - dpkg-shlibdeps does not exist off Debian, so `$auto` below quietly
#     contributes nothing and the package installs onto systems missing half of
#     what it links.
#   - rpm dependency discovery falls back to walking ldd's whole transitive
#     closure, which names private host libraries no distribution ships.
#
# Each of those produces a package that looks correct and cannot run.

[package.metadata.deb]
name = "irontile"
maintainer = "Andrew Imm <aimm22@gmail.com>"
copyright = "2026, Andrew Imm"
license-file = ["../../LICENSE", "0"]
section = "x11"
priority = "optional"
extended-description = """
A Wayland tiling compositor with a split-container tree as its native model, \
rather than a plugin on top of a floating one."""
# $auto reads ELF headers, so it finds everything the binaries link and nothing
# they open by name at runtime. EGL and both wayland client libraries are
# dlopened, so they are named here or they are missed.
# polkitd is not linked either: the authentication agent talks to polkit's helper
# over a socket, and an agent with no polkit behind it is a prompt that never
# appears for an action that then fails.
# fonts-noto-core because everything that draws text names Noto Sans first, and
# because an empty font database is not text missing from a bar: cosmic-text
# panics, so a fresh install would have a lock screen that cannot lock.
depends = "$auto, libegl1, libwayland-client0, libwayland-egl1, polkitd, fonts-noto-core"
# Only the nested backend touches X, and that is for development rather than
# for running a session, so these are offered rather than pulled in.
# adwaita-icon-theme is a suggestion rather than a dependency because the bar
# draws its text and skips the icons it cannot find, which is a bar with fewer
# pictures rather than a broken one.
suggests = "libxcb1, libx11-xcb1, libxcursor1, adwaita-icon-theme"
# Paths are relative to this manifest, which is what cargo-deb resolves against.
# It will warn that they are not recognised as build artifacts; that is correct
# and expected, because the workspace is built first and packaged with
# --no-build.
assets = [
    ["../../target/release/irontile", "usr/bin/", "755"],
    ["../../target/release/irontile-bar", "usr/bin/", "755"],
    ["../../target/release/irontilectl", "usr/bin/", "755"],
    ["../../target/release/irontile-lock", "usr/bin/", "755"],
    ["../../target/release/irontile-polkit", "usr/bin/", "755"],
    ["../../target/release/start-irontile", "usr/bin/", "755"],
    ["../../assets/irontile.desktop", "usr/share/wayland-sessions/", "644"],
    ["../../assets/pam/debian", "etc/pam.d/irontile-lock", "644"],
    # cargo-deb compresses what it puts under usr/share/man itself.
    ["../../assets/man/*.1", "usr/share/man/man1/", "644"],
    # Three shells, three conventions, all of them read the directory without
    # being told to.
    ["../../assets/completions/irontilectl.bash", "usr/share/bash-completion/completions/irontilectl", "644"],
    ["../../assets/completions/_irontilectl", "usr/share/zsh/vendor-completions/_irontilectl", "644"],
    ["../../assets/completions/irontilectl.fish", "usr/share/fish/vendor_completions.d/irontilectl.fish", "644"],
]
# What the lock screen will accept is the administrator's to change, and an
# upgrade that quietly replaced it could lock somebody out of their own machine.
conf-files = ["/etc/pam.d/irontile-lock"]

[package.metadata.generate-rpm]
name = "irontile"
summary = "A Wayland tiling compositor"
# find-requires rather than the default: the fallback walks ldd's closure and
# invents dependencies on whatever the build host happened to have installed.
# Naming it means packaging outside an rpm distribution fails and says so,
# instead of producing something unsatisfiable.
auto-req = "find-requires"
# Unlike cargo-deb, these resolve against the workspace root.
assets = [
    { source = "target/release/irontile", dest = "/usr/bin/irontile", mode = "755" },
    { source = "target/release/irontile-bar", dest = "/usr/bin/irontile-bar", mode = "755" },
    { source = "target/release/irontilectl", dest = "/usr/bin/irontilectl", mode = "755" },
    { source = "target/release/irontile-lock", dest = "/usr/bin/irontile-lock", mode = "755" },
    { source = "target/release/irontile-polkit", dest = "/usr/bin/irontile-polkit", mode = "755" },
    { source = "target/release/start-irontile", dest = "/usr/bin/start-irontile", mode = "755" },
    { source = "assets/irontile.desktop", dest = "/usr/share/wayland-sessions/irontile.desktop", mode = "644" },
    # noreplace rather than a plain config: rpm's default moves an edited file
    # aside on upgrade and installs the packaged one, and what a lock screen
    # asks for is not ours to change under somebody. This matches what dpkg and
    # pacman do with the same file, so the three packages behave alike.
    { source = "assets/pam/fedora", dest = "/etc/pam.d/irontile-lock", mode = "644", config = "noreplace" },
    # rpm serves these uncompressed, which man reads just as happily. Named one
    # by one because there is no globbing here.
    { source = "assets/man/irontile.1", dest = "/usr/share/man/man1/irontile.1", mode = "644", doc = true },
    { source = "assets/man/irontile-bar.1", dest = "/usr/share/man/man1/irontile-bar.1", mode = "644", doc = true },
    { source = "assets/man/irontile-lock.1", dest = "/usr/share/man/man1/irontile-lock.1", mode = "644", doc = true },
    { source = "assets/man/irontile-polkit.1", dest = "/usr/share/man/man1/irontile-polkit.1", mode = "644", doc = true },
    { source = "assets/man/irontilectl.1", dest = "/usr/share/man/man1/irontilectl.1", mode = "644", doc = true },
    { source = "assets/man/start-irontile.1", dest = "/usr/share/man/man1/start-irontile.1", mode = "644", doc = true },
    # Three shells, three conventions, all of them read the directory without
    # being told to.
    { source = "assets/completions/irontilectl.bash", dest = "/usr/share/bash-completion/completions/irontilectl", mode = "644" },
    { source = "assets/completions/_irontilectl", dest = "/usr/share/zsh/site-functions/_irontilectl", mode = "644" },
    { source = "assets/completions/irontilectl.fish", dest = "/usr/share/fish/vendor_completions.d/irontilectl.fish", mode = "644" },
    # Not marked doc: rpm skips documentation when the install sets nodocs,
    # which minimal installs and every container image do, and the licence is
    # the one file that has to be there. cargo-generate-rpm has no %license
    # flag of its own, so a plain file in the conventional place it is.
    { source = "LICENSE", dest = "/usr/share/licenses/irontile/LICENSE", mode = "644" },
]

# Dlopened, so find-requires cannot see them either.
[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
# Not a library at all: the authentication agent reaches polkit's helper over a
# socket, so nothing in the binaries names it and find-requires cannot know.
"polkit" = "*"
# Named rather than found: nothing links a font, and an empty font database is
# not a bar without text but a panic out of the text shaper.
"google-noto-sans-fonts" = "*"

# The bar draws its text and skips the icons it cannot find, so this improves a
# bar rather than fixing one.
[package.metadata.generate-rpm.recommends]
"adwaita-icon-theme" = "*"
