# Which backend answers which portal request, for a session running irontile.
#
# xdg-desktop-portal is a front desk: applications ask it to pick a file, take
# a screenshot or share the screen, and it hands each request to a backend. It
# picks the backend by reading this file, which it finds by the name of the
# desktop -- XDG_CURRENT_DESKTOP, which is `irontile` because the session entry
# says so.
#
# Without this file the default backend answers everything it can, and screen
# sharing is simply absent: the gtk backend does not implement ScreenCast, so
# `org.freedesktop.portal.ScreenCast` never appears on the bus and every
# application's "share your screen" button fails with nothing to explain it.

[preferred]
# Everything unremarkable: file pickers, settings, notifications, opening a
# URI. The gtk backend is good at these and none of them want anything from a
# compositor.
default=gtk

# The two that can only come from the compositor, because they need its frames.
# xdg-desktop-portal-wlr drives capture over wlr-screencopy, which irontile
# speaks, and carries the PipeWire plumbing that hands a stream to the
# application asking.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# Deliberately nobody, which is what sway does and for the same reason: the gtk
# backend's Inhibit asks org.gnome.SessionManager, which is not running here.
# With no backend for it, a program that wants the screen kept awake falls back
# to the idle-inhibit protocol -- which irontile does implement, and which is
# the better answer anyway, because an inhibitor tied to a window stops
# counting when that window goes away.
org.freedesktop.impl.portal.Inhibit=none
