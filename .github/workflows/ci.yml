name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Everything the build links, named rather than relied on: a runner image
  # ships a great deal by default, and a build that depends on which of it
  # happens to be there breaks when the image changes rather than when the code
  # does. None of these are on the image today.
  #
  # libxkbcommon: keymaps.       libinput, libudev, libseat: the session backend.
  # libdrm, libgbm: modesetting. libpulse: the bar reads the volume from it.
  # libwayland: the test client dlopens libwayland-client to talk to the
  # compositor under test, so it is needed to run the tests, not to build them.
  #
  # EGL and the GL driver are dlopened at runtime too, but nothing asks them for
  # a context here: the integration tests use the headless backend, so no
  # display server and no GL driver are needed to run them.
  # hicolor-icon-theme: the icon tests resolve names against the themes that are
  # installed, and assert that even a name nobody has still lands on a fallback.
  # A runner image happens to ship one; a container does not, and a test that
  # passes only where the image is fat is a test nobody can reproduce.
  SYSTEM_DEPS: >-
    libxkbcommon-dev
    libwayland-dev
    hicolor-icon-theme
    libinput-dev
    libudev-dev
    libseat-dev
    libdrm-dev
    libgbm-dev
    libpulse-dev

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ${{ env.SYSTEM_DEPS }}
      # Sets up rustup; which toolchain actually compiles is rust-toolchain.toml's
      # to say, and it outranks whatever is made default here. That file is the
      # single place the version lives.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Everything CI runs is what `cargo xtask test` runs locally, so a green
      # local run means a green pipeline.
      - run: cargo xtask test

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ${{ env.SYSTEM_DEPS }}
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      # RUSTUP_TOOLCHAIN, not the toolchain the action made default: a
      # rust-toolchain.toml in the repo outranks `rustup default`, so without
      # this the job installs 1.90 and then quietly compiles with whatever
      # stable happens to be -- passing while saying nothing about the version
      # it is named after.
      - run: cargo check --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.90.0

  # The layout engine is meant to stay portable enough to become a WASM
  # component later. Building it for wasm32 keeps that honest from the start.
  wasm:
    name: layout builds for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package irontile-layout --target wasm32-unknown-unknown
